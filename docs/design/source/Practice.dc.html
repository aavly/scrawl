<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl practice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">
<div style="height: 100%; box-sizing: border-box; padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--card-text); box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<span style="font-weight: 800; font-size: 32px">Practice</span>
</div>
<p style="margin: 0 0 4px; font-size: 17px; font-weight: 500; line-height: 1.3">Pick a bot. Unranked, so your rating never changes.</p>

<sc-for list="{{bots}}" as="b" hint-placeholder-count="5">
<a href="Board.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 84px; box-sizing: border-box; padding: 0 16px; border: 3px solid var(--line); border-radius: 22px; background: var(--card); color: var(--card-text); box-shadow: 4px 5px 0 var(--shadow); text-decoration: none">
<span style="width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid var(--line); background: {{b.bg}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{b.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: 800; font-size: 21px">{{b.name}}</span>
<span style="font-size: 14px; font-weight: 500">{{b.line}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .04em">{{b.level}}</span>
<span style="display: flex; gap: 3px">
<sc-for list="{{b.bars}}" as="x" hint-placeholder-count="5">
<span style="width: 9px; height: 16px; border: 2px solid var(--line); border-radius: 3px; box-sizing: border-box; background: {{x.bg}}"></span>
</sc-for>
</span>
</span>
</a>
</sc-for>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const defs = [
  { name: 'Pip', level: 'EASY', line: 'Learns the ropes with you', bg: '#19D3A2', ink: '#141414' },
  { name: 'Dash', level: 'CASUAL', line: 'Quick, but a bit sloppy', bg: '#FFD84A', ink: '#141414' },
  { name: 'Bolt', level: 'SKILLED', line: 'A solid all-rounder', bg: '#FF5FA2', ink: '#141414' },
  { name: 'Nova', level: 'HARD', line: 'Always finds the long ones', bg: '#2F4BFF', ink: '#FFFFFF' },
  { name: 'Titan', level: 'BRUTAL', line: 'Hardly ever misses', bg: '#141414', ink: '#FFD84A' }
];
const bots = defs.map((b, i) => {
  const bars = [];
  for (let k = 0; k < 5; k++) bars.push({ bg: k <= i ? 'var(--card-text)' : 'transparent' });
  return { name: b.name, level: b.level, line: b.line, bg: b.bg, ink: b.ink, bars: bars };
});
return { themeCls: this.props.theme === 'dark' ? 'sc-dark' : '', bots: bots };
}
}
</script>
</body>
</html>
