<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">
<div style="height: 100%; box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--card-text); box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<span style="font-weight: 800; font-size: 32px">Leaderboard</span>
</div>

<div style="display: flex; gap: 8px">
<a href="Leaderboard.dc.html" style="flex: 1; height: 48px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 99px; background: {{gBg}}; color: {{gFg}}; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 800; font-size: 16px">
<sc-if value="{{isGlobal}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
<span>Global</span>
</a>
<a href="Leaderboard-US.dc.html" style="flex: 1; height: 48px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 99px; background: {{cBg}}; color: {{cFg}}; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 800; font-size: 16px">
<sc-if value="{{isCountry}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
<span>United States</span>
</a>
</div>

<div style="background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 24px; box-shadow: 4px 5px 0 var(--shadow); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 16px; box-shadow: inset 0 -2px 0 rgba(128,128,128,.25)">
<span style="width: 30px; flex: none; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px">{{r.rank}}</span>
<span style="width: 34px; height: 34px; flex: none; border-radius: 50%; border: 3px solid var(--line); background: {{r.bg}}; box-sizing: border-box"></span>
<span style="flex: 1; min-width: 0; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="padding: 0 8px; border: 2px solid var(--line); border-radius: 99px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px">{{r.cc}}</span>
<span style="width: 58px; text-align: right; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px">{{r.rating}}</span>
</div>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 72px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 22px; background: #FF5FA2; color: #141414; box-shadow: 4px 5px 0 var(--shadow); padding: 0 16px; display: flex; align-items: center; gap: 12px">
<span style="min-width: 62px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px">{{myRank}}</span>
<span style="width: 38px; height: 38px; flex: none; border-radius: 50%; border: 3px solid #141414; background: #19D3A2; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13 8 2l6 11z" fill="#141414"/></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 0">
<span style="font-weight: 800; font-size: 17px">You · wordfox_</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: .06em">GOLD II</span>
</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px">1,642</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["global","country"],"default":"global","section":"State"},"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const country = this.props.tab === 'country';
const G = [
  ['1','mxlr_','KR','2,874'], ['2','quillbert','US','2,851'], ['3','sawdust.ln','GB','2,839'], ['4','haru_no_ji','JP','2,812'],
  ['5','papaya_pete','BR','2,790'], ['6','ellisonw','US','2,776'], ['7','zoe.bee','AU','2,761'], ['8','tomkat_','CA','2,748']
];
const U = [
  ['1','quillbert','US','2,851'], ['2','ellisonw','US','2,776'], ['3','jaymac_','US','2,702'], ['4','nova.lin','US','2,688'],
  ['5','bigfootbill','US','2,671'], ['6','pia_sticks','US','2,655'], ['7','cj_thorn','US','2,640'], ['8','dani.grams','US','2,631']
];
const av = ['#FFD84A','#19D3A2','#FF5FA2','#2F4BFF','#FFFFFF'];
const src = country ? U : G;
const rows = src.map((r, i) => ({ rank: r[0], name: r[1], cc: r[2], rating: r[3], bg: av[i % 5] }));
return {
  themeCls: this.props.theme === 'dark' ? 'sc-dark' : '',
  rows: rows,
  isGlobal: !country, isCountry: country,
  gBg: country ? 'var(--card)' : 'var(--text)', gFg: country ? 'var(--card-text)' : 'var(--bg)',
  cBg: country ? 'var(--text)' : 'var(--card)', cFg: country ? 'var(--bg)' : 'var(--card-text)',
  myRank: country ? '#612' : '#4,218'
};
}
}
</script>
</body>
</html>
