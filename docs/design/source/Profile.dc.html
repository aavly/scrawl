<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">
<div style="height: 100%; box-sizing: border-box; padding: 56px 20px 30px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--card-text); box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<span style="font-weight: 800; font-size: 32px">Profile</span>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 92px; height: 92px; flex: none">
<div style="width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--line); background: #19D3A2; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="44" height="44" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13 8 2l6 11z" fill="#141414"/></svg>
</div>
<button type="button" aria-label="Change avatar" style="position: absolute; right: -4px; bottom: -4px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); background: #FFD84A; color: #141414; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 800; font-size: 30px; line-height: 1">wordfox_</span>
<div style="display: flex; gap: 6px; align-items: center">
<span style="padding: 1px 10px; border: 2px solid var(--line); border-radius: 99px; background: var(--card); color: var(--card-text); font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px">US</span>
<span style="padding: 1px 10px; border: 2px dashed var(--line); border-radius: 99px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px">GUEST</span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 22px; box-shadow: 4px 5px 0 var(--shadow); padding: 12px 18px">
<span style="padding: 4px 14px; border: 3px solid var(--line); border-radius: 99px; background: #FFD84A; color: #141414; font-weight: 800; font-size: 16px; letter-spacing: .06em">GOLD II</span>
<span style="font-weight: 800; font-size: 40px; line-height: 1">1,642</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 20px; box-shadow: 4px 5px 0 var(--shadow); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .08em">WINS</span>
<span style="font-weight: 800; font-size: 34px; line-height: 1.05">38</span>
</div>
<div style="background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 20px; box-shadow: 4px 5px 0 var(--shadow); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .08em">LOSSES</span>
<span style="font-weight: 800; font-size: 34px; line-height: 1.05">21</span>
</div>
<div style="background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 20px; box-shadow: 4px 5px 0 var(--shadow); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .08em">BEST WORD</span>
<span style="font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: .04em">ASTRIDE</span>
</div>
<div style="background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 20px; box-shadow: 4px 5px 0 var(--shadow); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .08em">HIGH SCORE</span>
<span style="font-weight: 800; font-size: 34px; line-height: 1.05">5,240</span>
</div>
</div>

<div style="margin-top: auto; background: #2F4BFF; color: #FFFFFF; border: 3px solid var(--line); border-radius: 24px; box-shadow: 5px 6px 0 var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 800; font-size: 22px">Keep your progress</span>
<span style="font-size: 15px; font-weight: 500; line-height: 1.3">You're playing as a guest. Sign in with Apple so your rating and stats follow you to a new phone.</span>
</div>
<button type="button" style="height: 52px; border: 3px solid #141414; border-radius: 16px; background: #141414; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Sign in with Apple</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeCls: this.props.theme === 'dark' ? 'sc-dark' : '' };
}
}
</script>
</body>
</html>
