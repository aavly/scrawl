<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl report a player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">
<div style="height: 100%; box-sizing: border-box; padding: 56px 20px 30px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<a href="Results.dc.html" aria-label="Close report" style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--card-text); box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<span style="font-weight: 800; font-size: 32px">Report kaijumo</span>
</div>
<p style="margin: 0 0 4px; font-size: 17px; font-weight: 500; line-height: 1.3">What went wrong? The match result stays as it is.</p>

<div role="radiogroup" aria-label="Reason" style="display: flex; flex-direction: column; gap: 10px">
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 3px solid var(--line); border-radius: 20px; background: var(--card); color: var(--card-text); box-shadow: 3px 4px 0 var(--shadow); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; text-align: left; cursor: pointer">
<span style="width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--line); box-sizing: border-box"></span>
<span>Offensive username or avatar</span>
</button>
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 3px solid var(--line); border-radius: 20px; background: #FFD84A; color: #141414; box-shadow: 3px 4px 0 var(--shadow); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; text-align: left; cursor: pointer">
<span style="width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid #141414; background: #141414; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFD84A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</span>
<span>Cheating or using a tool</span>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 3px solid var(--line); border-radius: 20px; background: var(--card); color: var(--card-text); box-shadow: 3px 4px 0 var(--shadow); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; text-align: left; cursor: pointer">
<span style="width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--line); box-sizing: border-box"></span>
<span>Harassment or abusive behaviour</span>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 3px solid var(--line); border-radius: 20px; background: var(--card); color: var(--card-text); box-shadow: 3px 4px 0 var(--shadow); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; text-align: left; cursor: pointer">
<span style="width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--line); box-sizing: border-box"></span>
<span>Something else</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rp-details" style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: .1em">DETAILS (OPTIONAL)</label>
<textarea id="rp-details" rows="3" placeholder="Tell us what happened" style="width: 100%; box-sizing: border-box; border: 3px solid var(--line); border-radius: 18px; background: var(--card); color: var(--card-text); padding: 12px 14px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 500; resize: none"></textarea>
</div>

<a href="Results.dc.html" style="margin-top: auto; height: 72px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 24px; background: #2F4BFF; color: #FFFFFF; box-shadow: 0 7px 0 var(--shadow); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 800; font-size: 26px">Send report</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeCls: this.props.theme === 'dark' ? 'sc-dark' : '' };
}
}
</script>
</body>
</html>
