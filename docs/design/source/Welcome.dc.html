<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
@keyframes sc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sc-wobble{0%,100%{transform:rotate(8deg) scale(1)}50%{transform:rotate(3deg) scale(1.08)}}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.5px, transparent 1.6px); background-size: 18px 18px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">

<div style="position: absolute; right: 18px; top: 66px; width: 88px; height: 88px; animation: sc-wobble 2.4s ease-in-out infinite">
<svg width="88" height="88" viewBox="0 0 80 80" aria-hidden="true"><polygon points="76,40 66.8,51.1 65.5,65.5 51.1,66.8 40,76 28.9,66.8 14.5,65.5 13.2,51.1 4,40 13.2,28.9 14.5,14.5 28.9,13.2 40,4 51.1,13.2 65.5,14.5 66.8,28.9" fill="#FF5FA2" stroke="#141414" stroke-width="3" stroke-linejoin="round"/></svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #141414; transform: rotate(-8deg)">1v1</div>
</div>

<div style="height: 100%; box-sizing: border-box; padding: 150px 24px 40px; display: flex; flex-direction: column; gap: 30px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="display: flex; gap: 6px; justify-content: center">
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #FF5FA2; box-shadow: 0 5px 0 #141414; transform: rotate(-5deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #141414; animation: sc-bob 2.2s ease-in-out infinite">S</div>
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #FFFFFF; box-shadow: 0 5px 0 #141414; transform: rotate(3deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #141414; animation: sc-bob 2.2s ease-in-out .15s infinite">C</div>
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #19D3A2; box-shadow: 0 5px 0 #141414; transform: rotate(-2deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #141414; animation: sc-bob 2.2s ease-in-out .3s infinite">R</div>
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #FFFFFF; box-shadow: 0 5px 0 #141414; transform: rotate(4deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #141414; animation: sc-bob 2.2s ease-in-out .45s infinite">A</div>
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #2F4BFF; box-shadow: 0 5px 0 #141414; transform: rotate(-4deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #FFFFFF; animation: sc-bob 2.2s ease-in-out .6s infinite">W</div>
<div style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #141414; border-radius: 14px; background: #FF5FA2; box-shadow: 0 5px 0 #141414; transform: rotate(2deg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #141414; animation: sc-bob 2.2s ease-in-out .75s infinite">L</div>
</div>
<svg width="220" height="14" viewBox="0 0 220 14" aria-hidden="true"><path d="M3 8 C24 1, 40 13, 62 7 S100 1, 124 8 S176 13, 217 4" fill="none" stroke="#2F4BFF" stroke-width="5" stroke-linecap="round"/></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-weight: 800; font-size: 54px; line-height: .98; letter-spacing: -.02em">
<span style="display: block">Find words.</span>
<span style="display: block">Beat people.</span>
</h1>
<p style="margin: 0; font-size: 19px; font-weight: 500; line-height: 1.3">80-second word battles. Climb the ranks against players around the world.</p>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<a href="Tutorial.dc.html" style="height: 88px; box-sizing: border-box; border: 3px solid var(--line); border-radius: 28px; background: #2F4BFF; color: #FFFFFF; box-shadow: 0 8px 0 var(--shadow); display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; font-weight: 800; font-size: 34px">
<span>Let's play</span>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
</a>
<span style="text-align: center; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: .06em; padding-top: 6px">NO SIGN-UP · YOU'LL PLAY AS A GUEST</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeCls: this.props.theme === 'dark' ? 'sc-dark' : '' };
}
}
</script>
</body>
</html>
