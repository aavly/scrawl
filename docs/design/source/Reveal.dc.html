<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrawl opponent reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}
.sc{--bg:#FFD84A;--dot:rgba(20,20,20,.13);--text:#141414;--muted:#3B3B3B;--card:#FFFFFF;--card-text:#141414;--line:#141414;--shadow:#141414;--tile:#FFFFFF;--board:#2F4BFF}
.sc-dark{--bg:#17142E;--dot:rgba(255,246,214,.07);--text:#FFF6D6;--muted:#C9C3E8;--card:#2A2552;--card-text:#FFF6D6;--line:#0B0A1A;--shadow:#0B0A1A}
@keyframes sc-slam{0%{transform:rotate(-3deg) scale(1.6);opacity:0}60%{transform:rotate(-3deg) scale(.95);opacity:1}100%{transform:rotate(-3deg) scale(1);opacity:1}}
@keyframes sc-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</helmet>
<div class="sc {{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.5px, transparent 1.6px); background-size: 18px 18px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text)">
<div style="height: 100%; box-sizing: border-box; padding: 64px 16px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px">

<div style="padding: 6px 22px; border: 4px solid #141414; border-radius: 18px; background: {{headBg}}; color: #141414; font-weight: 800; font-size: 36px; line-height: 1.05; letter-spacing: .02em; box-shadow: 5px 6px 0 var(--shadow); animation: sc-slam .5s ease-out forwards">{{headline}}</div>

<div style="position: relative; display: flex; gap: 12px; width: 100%; margin-top: 10px">

<div style="flex: 1; min-width: 0; background: var(--card); color: var(--card-text); border: 3px solid var(--line); border-radius: 24px; box-shadow: 4px 5px 0 var(--shadow); padding: 20px 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--line); background: #19D3A2; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="44" height="44" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13 8 2l6 11z" fill="#141414"/></svg>
</div>
<span style="font-weight: 800; font-size: 21px">wordfox_</span>
<span style="padding: 1px 10px; border: 2px solid var(--line); border-radius: 99px; background: #FFD84A; color: #141414; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px">US</span>
<div style="display: flex; flex-direction: column; align-items: center; margin-top: 4px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: .1em">GOLD II</span>
<span style="font-weight: 800; font-size: 34px; line-height: 1.05">1,642</span>
</div>
</div>

<div style="flex: 1; min-width: 0; background: #FF5FA2; color: #141414; border: 3px {{oppBorder}} var(--line); border-radius: 24px; box-shadow: 4px 5px 0 var(--shadow); padding: 20px 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="width: 92px; height: 92px; border-radius: 50%; border: 3px solid #141414; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isHuman}}" hint-placeholder-val="{{ true }}">
<svg width="44" height="44" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="#141414"/></svg>
</sc-if>
<sc-if value="{{isBot}}" hint-placeholder-val="{{ false }}">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/></svg>
</sc-if>
</div>
<span style="font-weight: 800; font-size: 21px">{{oppName}}</span>
<span style="padding: 1px 10px; border: 2px solid #141414; border-radius: 99px; background: {{tagBg}}; color: {{tagFg}}; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px">{{tag}}</span>
<div style="display: flex; flex-direction: column; align-items: center; margin-top: 4px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: .1em">{{oppTier}}</span>
<span style="font-weight: 800; font-size: 34px; line-height: 1.05">{{oppRating}}</span>
</div>
</div>

<div style="position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid var(--line); background: #141414; color: #FFD84A; box-shadow: 0 4px 0 var(--shadow); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">VS</div>
</div>

<div style="width: 100%; box-sizing: border-box; padding: 12px 16px; border: 3px solid var(--line); border-radius: 18px; background: var(--card); color: var(--card-text); box-shadow: 3px 4px 0 var(--shadow); font-size: 15px; font-weight: 600; line-height: 1.3; text-align: center">{{note}}</div>

<a href="Board.dc.html" aria-label="Start the round" style="margin-top: auto; width: 128px; height: 128px; border-radius: 50%; border: 4px solid #141414; background: #2F4BFF; color: #FFFFFF; box-sizing: border-box; box-shadow: 0 8px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; animation: sc-pulse 1s ease-in-out infinite">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">STARTING IN</span>
<span style="font-weight: 800; font-size: 72px; line-height: .95">3</span>
</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["human","bot"],"default":"human","section":"State"},"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bot = this.props.kind === 'bot';
return {
  themeCls: this.props.theme === 'dark' ? 'sc-dark' : '',
  isBot: bot, isHuman: !bot,
  headline: bot ? 'BOT MATCH' : 'MATCH FOUND!',
  headBg: bot ? '#FFFFFF' : '#19D3A2',
  oppName: bot ? 'Echo' : 'kaijumo',
  oppBorder: bot ? 'dashed' : 'solid',
  tag: bot ? 'BOT' : 'JP',
  tagBg: bot ? '#141414' : '#FFD84A',
  tagFg: bot ? '#FFFFFF' : '#141414',
  oppTier: bot ? 'GOLD II-ish' : 'GOLD II',
  oppRating: bot ? '1,640' : '1,655',
  note: bot ? 'Nobody was around, so Echo (a bot) is stepping in. Bots are always labelled and play like a real opponent near your rating.' : 'Ranked · same board for both of you · 80 seconds. Higher total wins.'
};
}
}
</script>
</body>
</html>
